version: '3.8'

services:
  db:
    build: .
    container_name: barbearia_db
    restart: always
    environment:
      POSTGRES_USER: wesley
      POSTGRES_PASSWORD: root
      POSTGRES_DB: barbearia
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wesley -d barbearia"]
      interval: 10s
      timeout: 5s
      retries: 5
